amcl:
  ros__parameters:
    use_sim_time: false
    # No usaremos AMCL (Localización por mapa), pero Nav2 a veces pide el nodo.
    
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom          # ¡CRUCIAL! Nuestro mundo es la odometría
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      split_path: true
      max_vel_x: 0.3
      min_vel_x: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      
      # --- ¡AÑADE ESTO! Los Jueces (Critics) ---
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.4         # Ajusta al radio de tu robot en metros
      global_frame: odom        # ¡CRUCIAL!
      robot_base_frame: base_link
      rolling_window: true      # Crea un mapa dinámico centrado en el robot
      width: 10
      height: 10
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.3
      global_frame: odom        # ¡CRUCIAL!
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server',
                 'smoother_server',
                 'planner_server',
                 'route_server',
                 'behavior_server',
                 'bt_navigator',
                 'waypoint_follower',
                 'velocity_smoother',
                 'opennav_docking']