ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 20.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Motores (RoboClaw)
    odom0: /sigyn/wheel_odom
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, true, false, false, false]
    odom0_differential: true

    # IMU (BNO08X)
    imu0: /imu_topic
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

    # Flujo Óptico (MTF-02P)
    #odom1: /sensor/odom
    #odom1_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    #odom1_relative: true