# Parámetros específicos para simulación con TurtleBot3
health_node:
  ros__parameters:
    # En simulación, ignoramos sensores físicos que no existen en Gazebo
    check_imu: false
    check_motors: false
    check_odom: true   # Este es vital para que el BT sepa que la simulación responde
    check_flow: false

polar_action_server:
  ros__parameters:
    k_rho: 0.35
    k_alpha: 0.8
    k_beta: -0.15
    max_v: 0.22        # Límite estándar del TB3 Burger
    max_w: 1.0
    dist_tolerance: 0.05
    yaw_tolerance: 0.1

smc_dfl_action_server:
  ros__parameters:
    # Ganancias reducidas para la masa del TB3
    lambda1: 2.5
    lambda2: 2.5
    k1_sta: 0.5
    k2_sta: 0.2
    eps_v: 0.1         # Protección de singularidad aumentada
    max_v: 0.22
    max_w: 1.0